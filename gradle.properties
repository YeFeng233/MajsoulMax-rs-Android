org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Set to false on machines without a Rust/NDK toolchain: the Gradle build then
# expects a pre-built libmajsoulmax.so to already sit in app/src/main/jniLibs.
# CI leaves this at true.
# ---------------------------------------------------------------------------
majsoulmax.buildRust=true
