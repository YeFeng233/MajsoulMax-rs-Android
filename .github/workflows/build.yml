name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: 'Meta kernel release tag (blank = latest)'
        required: false
        default: ''
      build_type:
        description: 'Gradle build type'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  TARGET_ABIS: arm64-v8a armeabi-v7a

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install protoc
        # Upstream's build.rs compiles liqi.proto, so this is not optional.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # MajsoulMax-rs is edition 2024, which needs 1.85+.
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Resolve upstream revision
        id: upstream
        # The cargo cache must key on the submodule commit: majsoul-jni is a
        # standalone workspace, so nothing else in this repo changes when upstream
        # moves.
        run: echo "rev=$(git -C external/MajsoulMax-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/majsoul-jni/target
          key: >-
            cargo-${{ runner.os }}-${{ steps.upstream.outputs.rev }}-${{
            hashFiles('rust/majsoul-jni/Cargo.toml', 'patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^3

      - name: Build the Meta kernel payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIHOMO_VERSION: ${{ github.event.inputs.mihomo_version }}
        run: ./scripts/fetch-mihomo.sh "${MIHOMO_VERSION:-latest}"

      - name: Build hev-socks5-tunnel
        run: ./scripts/build-tun2socks.sh

      - name: Build the Rust MITM core
        run: ./scripts/build-rust.sh

      - name: Restore repository signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ci-keystore.jks
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          case "$TYPE" in
            debug)   ./gradlew --no-daemon -Pmajsoulmax.buildRust=false assembleDebug ;;
            *)       ./gradlew --no-daemon -Pmajsoulmax.buildRust=false assembleRelease ;;
          esac

      # A 4 KB aligned LOAD segment cannot be mapped on a device with 16 KB
      # pages: the APK installs and the library fails to load. Check the packed
      # artifact rather than the build tree, so what ships is what is measured.
      - name: Verify 16 KB page alignment
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [[ -x "$READELF" ]] || { echo "::error::llvm-readelf not found at $READELF"; exit 1; }

          APK="$(find app/build/outputs/apk -name '*.apk' | head -1)"
          [[ -n "$APK" ]] || { echo "::error::no APK to check"; exit 1; }
          echo "checking $(basename "$APK")"

          tmp="$(mktemp -d)"
          unzip -q -o "$APK" 'lib/*' -d "$tmp"

          status=0
          while IFS= read -r so; do
            rel="${so#"$tmp"/}"
            bad=0
            for align in $("$READELF" -lW "$so" | awk '/^  LOAD/{print $NF}' | sort -u); do
              (( align < 16384 )) && bad=1
            done
            if (( bad == 0 )); then
              printf '  ok      %s\n' "$rel"
            elif [[ "$rel" == *armeabi-v7a/libmihomo.so ]]; then
              # Upstream's prebuilt; see scripts/fetch-mihomo.sh. 32-bit libraries
              # never load on a 16 KB-page device, so this is recorded, not failed.
              printf '::warning::%s is not 16 KB aligned (upstream prebuilt)\n' "$rel"
            else
              printf '::error::%s is not 16 KB aligned\n' "$rel"
              status=1
            fi
          done < <(find "$tmp/lib" -name '*.so' | sort)

          exit "$status"

      - name: Report payload sizes
        if: always()
        run: |
          echo '### Native payloads' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| ABI | library | size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for so in $(find app/src/main/jniLibs app/build/generated/jniLibs \
                        -name '*.so' 2>/dev/null | sort); do
            abi=$(basename "$(dirname "$so")")
            echo "| $abi | $(basename "$so") | $(du -h "$so" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### APKs' >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: majsoulmax-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/mapping/**/mapping.txt') != ''
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/**/mapping.txt
          retention-days: 30

      - name: Save cargo cache
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/majsoul-jni/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test "$RELEASE_TAG" = "v$VERSION" || { echo "Tag and APK version differ" >&2; exit 1; }
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/MajsoulMax-rs-Android-$RELEASE_TAG.apk"
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish edge build
        # A rolling pre-release of `main`. Without it the only token-free way to
        # get a branch build onto a device would be to mint a real version, which
        # would put untested builds in the release list.
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge build (latest main)
          prerelease: true
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
          body: |
            自动构建的 `main` 最新产物，**不是正式版本**，仅供测试安装。
            正式版本请使用 Releases 中带版本号的条目。

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 更新内容

            - **修复代理启动后游戏断网**：默认 tun 网段原本是 `198.18.0.1/30`，与
              Clash / mihomo / v2ray-tun2socks / hev 自带的约定重合（Clash 的
              fake-ip 也覆盖该网段）。当手机上已有这类代理的 tun 占用同一子网时，
              本应用自身的出站连接会被源地址选到对方网卡上，全部超时。本版改用
              `172.20.0.1/30`，并同步更换了 IPv6 地址。
            - 顺带提醒：若手机上有其他全局代理，请先将其停止再使用本应用。
            - **修复 MITM 内核启动即 panic**：reqwest 0.13 在 Android 上默认走
              rustls-platform-verifier，它需要宿主提供 JVM Context。本版改为固定
              使用系统根证书，协议数据自动更新恢复正常。
            - **内核崩溃不再是谜**：现在会记录 panic 的真实原因、位置与回溯，
              不再只有一句"核心线程 panic"。
            - 修复全新安装时"配置文件"检查失败、代理开关无法开启的问题。
              上游 0.7.0 已改用 max_data.yaml，本版已同步打包并校验该文件。
            - 新增"高级设置"选项卡，集中 GitHub Token、转发的 method/action、
              主角色 ID、角色皮肤映射和原始 JSON，并附风险提示。
            - 日志页面支持"软件运行日志 / 程序日志"与"格式化 / 原始日志"切换。
            - 新增内置浏览器入口，可直接在应用内打开网页版雀魂。
            - 页面切换改为左右滑动；底部导航顺序为：首页、配置、日志、证书、关于。
            - 同步上游 MajsoulMax-rs 0.7.0，修复新版上游的 Android JNI 兼容问题。

            ## 安装说明

            下载下方 APK 安装，一个安装包同时包含 arm64-v8a 和 armeabi-v7a，无需另外选择架构。
            使用固定签名，包名为 `com.yefeng.majmax`，可以覆盖安装旧版本。
            使用教程：https://github.com/YeFeng233/MajsoulMax-rs-Android#readme

            请停止其他代理后再启动本应用；若功能未生效，可尝试切换到线路一以外的游戏线路。
