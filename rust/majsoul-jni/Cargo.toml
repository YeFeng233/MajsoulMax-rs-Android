[package]
name = "majsoul-jni"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Android JNI bridge around the MajsoulMax-rs MITM proxy core"
publish = false

# Standalone workspace: the upstream crate is consumed as a plain path
# dependency, not as a workspace member, so upstream stays unpatched.
[workspace]

[lib]
name = "majsoulmax"
crate-type = ["cdylib"]

[dependencies]
majsoul_max_rs = { path = "../../external/MajsoulMax-rs" }

# Only for its `rustls` re-export: upstream reaches rustls through hudsucker, so
# declaring the identical dependency lands on the same crate instance and the
# provider installed below is the one the proxy's own TLS stack will use.
hudsucker = { version = "0.25", default-features = false, features = [
    "rcgen-ca",
    "rustls-client",
] }

# Upstream uses serde derives but does not enable the derive feature itself.
serde = { version = "1", features = ["derive", "std"] }
anyhow = "1"
jni = "0.21"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
    "std",
], default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
